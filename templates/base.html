<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }} &middot; {{ app_tagline }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ app_name }} uses machine learning and transparent warning-sign rules to help you spot suspicious job postings before you apply.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  {% include "partials/navbar.html" %}

  <main id="main-content" class="page" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
